<!-- File1_LandingPage.html -->
<div id="view-landing" class="view-section min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 select-none">
  <!-- Spacer Top -->
  <div class="w-full max-w-md mx-auto pt-2 sm:pt-4"></div>

  <!-- Main Login Container -->
  <div class="w-full max-w-md mx-auto my-auto py-2">
    <!-- Branding -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-gradient-to-br from-emerald-500 via-teal-500 to-amber-400 p-1 shadow-lg shadow-emerald-500/20 mb-3">
        <div class="w-full h-full bg-white rounded-[22px] flex items-center justify-center overflow-hidden">
          <img id="landing-logo" src="https://cdn-icons-png.flaticon.com/512/2997/2997295.png" alt="Logo Sekolah" class="w-12 h-12 object-contain" />
        </div>
      </div>
      <div class="inline-flex items-center gap-2 bg-white/90 backdrop-blur-md px-3.5 py-1 rounded-full border border-emerald-100 shadow-sm mb-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-[11px] font-black text-emerald-800 uppercase tracking-wider">
          7 Kebiasaan Anak Indonesia Hebat
        </span>
      </div>
      <h1 class="text-2xl font-black text-slate-800 tracking-tight">Portal Jurnal Karakter</h1>
      <p id="landing-school-name" class="text-xs sm:text-sm text-slate-500 font-medium mt-1">SD Generasi Indonesia Hebat</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white/95 backdrop-blur-xl rounded-[32px] p-6 sm:p-8 shadow-xl border border-white/60 relative overflow-hidden">
      <!-- Accent Top Bar -->
      <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-emerald-500 via-teal-400 to-amber-400"></div>

      <!-- Role Selector Tabs -->
      <div class="flex items-center p-1 bg-slate-100 rounded-2xl mb-6">
        <button type="button" onclick="setLoginRole('Siswa')" id="tab-role-siswa" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 bg-white text-emerald-700 shadow-sm">
          <i class="fa-solid fa-graduation-cap mr-1"></i> Siswa
        </button>
        <button type="button" onclick="setLoginRole('Guru')" id="tab-role-guru" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 text-slate-600 hover:text-slate-900">
          <i class="fa-solid fa-chalkboard-user mr-1"></i> Guru
        </button>
        <button type="button" onclick="setLoginRole('Kepsek')" id="tab-role-kepsek" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 text-slate-600 hover:text-slate-900">
          <i class="fa-solid fa-user-tie mr-1"></i> Kepala Sekolah
        </button>
      </div>

      <!-- Form -->
      <form id="form-login" onsubmit="handleLoginSubmit(event)" class="space-y-4">
        <div>
          <label id="lbl-username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
            NISN Siswa
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
              <i id="icon-login-user" class="fa-solid fa-id-card"></i>
            </span>
            <input 
              type="text" 
              id="login-username" 
              required 
              placeholder="Masukkan NISN..." 
              class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
            Kata Sandi / PIN
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input 
              type="password" 
              id="login-password" 
              required 
              placeholder="Masukkan kata sandi / PIN..." 
              class="w-full pl-10 pr-11 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all"
            />
            <button 
              type="button" 
              onclick="toggleLoginPassword()" 
              class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600 transition"
            >
              <i id="icon-show-password" class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Alert Error Box -->
        <div id="login-error-box" class="hidden p-3 bg-rose-50 border border-rose-200 rounded-2xl text-xs text-rose-600 font-semibold flex items-center gap-2">
          <i class="fa-solid fa-circle-exclamation text-rose-500"></i>
          <span id="login-error-text"></span>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="btn-login-submit" 
          class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold rounded-2xl shadow-lg shadow-emerald-500/25 active:scale-[0.98] transition-all flex items-center justify-center gap-2"
        >
          <span id="btn-login-text">Masuk ke Portal</span>
          <i id="btn-login-icon" class="fa-solid fa-arrow-right"></i>
          <span id="btn-login-spinner" class="hidden"><i class="fa-solid fa-circle-notch fa-spin"></i></span>
        </button>
      </form>

      <!-- Quick Demo Accounts Helper -->
      <div class="mt-6 pt-5 border-t border-slate-100">
        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider text-center mb-2.5">
          Akun Uji Coba Default
        </p>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="fillQuickLogin('0012345678', '123456', 'Siswa')" class="p-2 text-center bg-slate-50 hover:bg-emerald-50 border border-slate-100 hover:border-emerald-200 rounded-xl text-[11px] font-medium text-slate-600 transition">
            Siswa 5A
          </button>
          <button type="button" onclick="fillQuickLogin('guru5a', '123456', 'Guru')" class="p-2 text-center bg-slate-50 hover:bg-emerald-50 border border-slate-100 hover:border-emerald-200 rounded-xl text-[11px] font-medium text-slate-600 transition">
            Guru 5A
          </button>
          <button type="button" onclick="fillQuickLogin('kepsek', '123456', 'Kepsek')" class="p-2 text-center bg-slate-50 hover:bg-emerald-50 border border-slate-100 hover:border-emerald-200 rounded-xl text-[11px] font-medium text-slate-600 transition">
            Kepsek
          </button>
        </div>
      </div>
    </div>

    <!-- Footer Copyright -->
    <p class="text-center text-xs text-slate-400 mt-6 font-medium">
      &copy; 2026 Kemdikbudristek - Generasi Emas Anak Indonesia Hebat
    </p>
  </div>

  <div class="w-full max-w-md mx-auto pb-2"></div>
</div>

<script>
  var currentSelectedRole = 'Siswa';

  function setLoginRole(role) {
    currentSelectedRole = role;
    var tabSiswa = document.getElementById('tab-role-siswa');
    var tabGuru = document.getElementById('tab-role-guru');
    var tabKepsek = document.getElementById('tab-role-kepsek');
    var lblUser = document.getElementById('lbl-username');
    var userInput = document.getElementById('login-username');
    var userIcon = document.getElementById('icon-login-user');

    // Reset styles
    [tabSiswa, tabGuru, tabKepsek].forEach(function(tab) {
      tab.className = "flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 text-slate-600 hover:text-slate-900";
    });

    if (role === 'Siswa') {
      tabSiswa.className = "flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 bg-white text-emerald-700 shadow-sm";
      lblUser.innerText = "NISN Siswa";
      userInput.placeholder = "Masukkan 10 digit NISN...";
      userIcon.className = "fa-solid fa-id-card";
    } else if (role === 'Guru') {
      tabGuru.className = "flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 bg-white text-emerald-700 shadow-sm";
      lblUser.innerText = "Username / NIP Guru";
      userInput.placeholder = "Masukkan username guru...";
      userIcon.className = "fa-solid fa-chalkboard-user";
    } else {
      tabKepsek.className = "flex-1 py-2 text-xs font-bold rounded-xl transition-all duration-200 bg-white text-emerald-700 shadow-sm";
      lblUser.innerText = "Username Kepala Sekolah";
      userInput.placeholder = "Masukkan username kepsek...";
      userIcon.className = "fa-solid fa-user-tie";
    }
    document.getElementById('login-error-box').classList.add('hidden');
  }

  function toggleLoginPassword() {
    var pass = document.getElementById('login-password');
    var icon = document.getElementById('icon-show-password');
    if (pass.type === 'password') {
      pass.type = 'text';
      icon.className = 'fa-regular fa-eye-slash';
    } else {
      pass.type = 'password';
      icon.className = 'fa-regular fa-eye';
    }
  }

  function fillQuickLogin(u, p, role) {
    setLoginRole(role);
    document.getElementById('login-username').value = u;
    document.getElementById('login-password').value = p;
  }

  function handleLoginSubmit(e) {
    e.preventDefault();
    var u = document.getElementById('login-username').value.trim();
    var p = document.getElementById('login-password').value.trim();
    var errBox = document.getElementById('login-error-box');
    var errText = document.getElementById('login-error-text');

    if (!u || !p) {
      errText.innerText = 'Harap isi NISN / Username dan Kata Sandi!';
      errBox.classList.remove('hidden');
      return;
    }

    errBox.classList.add('hidden');
    setLoginLoading(true);

    google.script.run
      .withSuccessHandler(function(res) {
        setLoginLoading(false);
        if (res && res.success) {
          appState.currentUser = {
            role: res.role,
            username: res.username,
            nama: res.nama,
            panggilan: res.panggilan || '',
            kelas: res.kelas || '-'
          };
          onLoginSuccess();
        } else {
          errText.innerText = (res && res.message) ? res.message : 'ID atau Kata Sandi salah!';
          errBox.classList.remove('hidden');
        }
      })
      .withFailureHandler(function(err) {
        setLoginLoading(false);
        errText.innerText = 'Koneksi gagal: ' + (err.message || 'Silakan coba beberapa saat lagi.');
        errBox.classList.remove('hidden');
      })
      .apiValidasiLogin(u, p);
  }

  function setLoginLoading(loading) {
    var btn = document.getElementById('btn-login-submit');
    var txt = document.getElementById('btn-login-text');
    var icon = document.getElementById('btn-login-icon');
    var spinner = document.getElementById('btn-login-spinner');
    if (loading) {
      btn.disabled = true;
      txt.innerText = 'Memverifikasi...';
      icon.classList.add('hidden');
      spinner.classList.remove('hidden');
    } else {
      btn.disabled = false;
      txt.innerText = 'Masuk ke Portal';
      icon.classList.remove('hidden');
      spinner.classList.add('hidden');
    }
  }
</script>
