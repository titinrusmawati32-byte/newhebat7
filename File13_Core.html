  <!-- Global JavaScript Router & State Machine -->
  <script>
    var appState = {
      currentUser: null,
      pengaturan: {
        namaSekolah: 'SD Generasi Indonesia Hebat',
        logoSekolah: 'https://cdn-icons-png.flaticon.com/512/2997/2997295.png',
        linkYoutube: '',
        usernameKepsek: 'kepsek',
        passwordKepsek: '123456'
      },
      habitsToday: {},
      materiKuisMap: {},
      currentView: 'landing'
    };

    window.addEventListener('DOMContentLoaded', function() {
      google.script.run
        .withSuccessHandler(function(cfg) {
          if (cfg) {
            appState.pengaturan = cfg;
            var lName = document.getElementById('landing-school-name');
            var lLogo = document.getElementById('landing-logo');
            if (lName) lName.innerText = cfg.namaSekolah;
            if (lLogo) lLogo.src = cfg.logoSekolah;
          }
        })
        .apiGetPengaturan();

      // Sinkronisasi seluruh materi & kuis guru ke menu siswa
      syncAllMateriKuisSiswa();
    });

    function syncAllMateriKuisSiswa(callback) {
      google.script.run
        .withSuccessHandler(function(map) {
          if (map) {
            appState.materiKuisMap = map;
            for (var i = 1; i <= 7; i++) {
              if (map[i]) applyMateriKuisDOM(i, map[i]);
            }
          }
          if (typeof callback === 'function') callback(map);
        })
        .withFailureHandler(function(err) {
          console.warn('Gagal sinkron materi & kuis: ', err);
          if (typeof callback === 'function') callback(null);
        })
        .apiGetMateriKuisAll();
    }

    // ==========================================
    // ROUTING & VIEW CONTROLLER
    // ==========================================
    function navigateTo(viewName) {
      appState.currentView = viewName;

      // Sembunyikan seluruh view section dengan display none eksplisit
      var views = document.querySelectorAll('.view-section');
      views.forEach(function(el) {
        el.classList.add('hidden');
        el.style.display = 'none';
      });

      // Munculkan target view
      var target = document.getElementById('view-' + viewName);
      if (target) {
        target.classList.remove('hidden');
        target.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      var sidebar = document.getElementById('main-sidebar');
      var header = document.getElementById('main-header');
      var bNav = document.getElementById('mobile-bottom-nav');
      var user = appState.currentUser || {};

      if (viewName === 'landing') {
        sidebar.classList.add('hidden');
        sidebar.classList.remove('md:flex');
        header.classList.add('hidden');
        bNav.classList.add('hidden');
      } else {
        if (user.role === 'Siswa') {
          // Mobile First Experience untuk Siswa
          sidebar.classList.add('hidden');
          sidebar.classList.remove('md:flex');
          header.classList.add('hidden');
          bNav.classList.remove('hidden');
        } else {
          // Tampilan Desktop untuk Guru & Kepsek
          sidebar.classList.remove('hidden');
          sidebar.classList.add('md:flex');
          header.classList.remove('hidden');
          bNav.classList.remove('hidden');
        }

        renderSidebarNav();
        renderMobileBottomNav();

        if (viewName === 'dashboard') {
          if (typeof renderDashboardUI === 'function') renderDashboardUI();
          if (typeof bukaTabSiswa === 'function') bukaTabSiswa('beranda');
        }

        // Otomatis sinkronkan materi & kuis guru saat membuka menu habit siswa
        if (viewName.indexOf('habit-') === 0) {
          updateBottomNavIcons('kelas');
          var hNum = parseInt(viewName.replace('habit-', ''), 10);
          if (!isNaN(hNum)) {
            renderMateriKuisSiswa(hNum);
            bukaStepHabitMobile(hNum, 1);
          }
        }
      }
    }

    // Wizard Pengatur Langkah 1, 2, 3 pada Setiap Habit Siswa
    function bukaStepHabitMobile(hid, stepNum) {
      for (var s = 1; s <= 3; s++) {
        var el = document.getElementById('h' + hid + '-step-' + s);
        if (el) {
          if (s === stepNum) {
            el.classList.remove('hidden');
            el.style.display = 'block';
          } else {
            el.classList.add('hidden');
            el.style.display = 'none';
          }
        }
      }

      // Pastikan kartu feedback kuis selalu tersembunyi sampai siswa memilih jawaban
      var fbCard = document.getElementById('h' + hid + '-feedback-card');
      if (fbCard && stepNum !== 3) {
        fbCard.classList.add('hidden');
        fbCard.style.display = 'none';
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navigateToHabit(habitNum) {
      if (typeof habitActiveCurrentId !== 'undefined') habitActiveCurrentId = habitNum;
      navigateTo('habit-' + habitNum);
      bukaStepHabitMobile(habitNum, 1);
      if (habitNum === 1 && typeof setH1PresetTime === 'function') {
        setH1PresetTime('05:30');
      }
      renderMateriKuisSiswa(habitNum);
    }

    function renderMateriKuisSiswa(habitNum) {
      if (!appState.materiKuisMap || !appState.materiKuisMap[habitNum]) {
        syncAllMateriKuisSiswa(function(map) {
          if (map && map[habitNum]) {
            applyMateriKuisDOM(habitNum, map[habitNum]);
          }
        });
      } else {
        applyMateriKuisDOM(habitNum, appState.materiKuisMap[habitNum]);
      }
    }

    function extractYouTubeId(url) {
      if (!url) return '';
      var match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/);
      return match ? match[1] : '';
    }

    function putarVideoMateriEdu(hid) {
      var id = hid || 1;
      var data = (appState.materiKuisMap && appState.materiKuisMap[id]) ? appState.materiKuisMap[id] : null;
      var url = (data && data.linkYoutube) ? data.linkYoutube : (appState.pengaturan ? appState.pengaturan.linkYoutube : 'https://www.youtube.com');
      var videoId = extractYouTubeId(url);

      var modal = document.getElementById('modal-video-player');
      var iframe = document.getElementById('mv-video-iframe');
      var titleEl = document.getElementById('mv-video-title');
      var descEl = document.getElementById('mv-video-desc');
      var openYt = document.getElementById('mv-video-open-yt');
      var badgeEl = document.getElementById('mv-habit-badge');

      if (videoId && modal && iframe) {
        iframe.src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1';
        if (titleEl) titleEl.innerText = (data && data.judulMateri) ? data.judulMateri : ('Materi Video Misi ' + id);
        if (descEl) descEl.innerText = (data && data.deskripsiMateri) ? data.deskripsiMateri : '';
        if (openYt) openYt.href = url;
        if (badgeEl) badgeEl.innerText = 'YouTube Materi Misi ' + id;
        modal.classList.remove('hidden');
      } else {
        window.open(url, '_blank');
      }
    }

    function tutupModalVideo() {
      var modal = document.getElementById('modal-video-player');
      var iframe = document.getElementById('mv-video-iframe');
      if (iframe) iframe.src = '';
      if (modal) modal.classList.add('hidden');
    }

    function lompatKeMateriSiswa(hid) {
      var card = document.getElementById('h' + hid + '-card-materi');
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('ring-4', 'ring-rose-400/50');
        setTimeout(function() {
          card.classList.remove('ring-4', 'ring-rose-400/50');
        }, 1500);
      }
    }

    function lompatKeKuisSiswa(hid) {
      var card = document.getElementById('h' + hid + '-card-kuis');
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('ring-4', 'ring-indigo-400/50');
        setTimeout(function() {
          card.classList.remove('ring-4', 'ring-indigo-400/50');
        }, 1500);
      }
    }

    function applyMateriKuisDOM(hid, data) {
      if (!data) return;

      // 1. Update Video YouTube Thumbnail & Links
      var thumbEl = document.getElementById('h' + hid + '-video-thumb');
      var videoId = extractYouTubeId(data.linkYoutube);
      if (thumbEl) {
        if (videoId) {
          thumbEl.src = 'https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg';
        } else if (data.linkYoutube && data.linkYoutube.indexOf('http') === 0) {
          thumbEl.src = 'https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=600&q=80';
        }
      }

      var tOverlay = document.getElementById('h' + hid + '-video-title-overlay');
      if (tOverlay && data.judulMateri) tOverlay.innerText = data.judulMateri;

      var tTitle = document.getElementById('h' + hid + '-video-title');
      if (tTitle && data.judulMateri) tTitle.innerText = data.judulMateri;

      var tDesc = document.getElementById('h' + hid + '-video-desc');
      if (tDesc && data.deskripsiMateri) tDesc.innerText = data.deskripsiMateri;

      var btnYt = document.getElementById('h' + hid + '-btn-youtube');
      if (btnYt && data.linkYoutube) btnYt.href = data.linkYoutube;

      // 2. Update Quiz Questions, Options, and Instant Verification
      var sText = document.getElementById('h' + hid + '-soal-text');
      var pText = document.getElementById('h' + hid + '-penjelasan-text');
      var container = document.getElementById('h' + hid + '-opsi-container');
      var fCard = document.getElementById('h' + hid + '-feedback-card');
      var fStatus = document.getElementById('h' + hid + '-feedback-status');
      var fIcon = document.getElementById('h' + hid + '-feedback-icon');

      if (data.pertanyaan && sText) {
        sText.innerText = '1. ' + data.pertanyaan.replace(/^\d+\.\s*/, '');
      }
      if (data.penjelasan && pText) {
        pText.innerText = data.penjelasan;
      }

      if (container && data.opsiA) {
        var charMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3 };
        var keyChar = (data.kunciJawaban || 'B').toUpperCase();
        var keyIdx = charMap[keyChar] !== undefined ? charMap[keyChar] : 1;
        var options = [data.opsiA, data.opsiB, data.opsiC, data.opsiD];
        var letters = ['A', 'B', 'C', 'D'];
        container.innerHTML = '';

        options.forEach(function(opt, idx) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.id = 'h' + hid + '-btn-opt-' + letters[idx];
          btn.className = "w-full p-3 rounded-2xl border border-slate-200 text-left text-xs font-semibold text-slate-700 hover:bg-slate-50 transition flex items-center justify-between";
          btn.innerHTML = `
            <span class="flex items-center gap-3">
              <span class="w-6 h-6 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-xs font-bold">${letters[idx]}</span>
              <span>${opt}</span>
            </span>
            <i class="fa-solid fa-circle-check text-transparent opt-check-icon text-base"></i>
          `;

          btn.onclick = function() {
            // Reset styles for all 4 option buttons
            for (var o = 0; o < letters.length; o++) {
              var ob = document.getElementById('h' + hid + '-btn-opt-' + letters[o]);
              if (ob) {
                ob.className = "w-full p-3 rounded-2xl border border-slate-200 text-left text-xs font-semibold text-slate-700 hover:bg-slate-50 transition flex items-center justify-between";
                var icon = ob.querySelector('.opt-check-icon');
                if (icon) icon.className = "fa-solid fa-circle-check text-transparent opt-check-icon text-base";
              }
            }

            if (fCard) {
              fCard.classList.remove('hidden');
              fCard.style.display = 'block';
            }

            if (idx === keyIdx) {
              btn.className = "w-full p-3 rounded-2xl border-2 border-emerald-500 bg-emerald-50 text-left text-xs font-bold text-emerald-900 transition flex items-center justify-between";
              var checkIcon = btn.querySelector('.opt-check-icon');
              if (checkIcon) checkIcon.className = "fa-solid fa-circle-check text-emerald-600 opt-check-icon text-base";
              
              if (fCard) fCard.className = "bg-emerald-50/90 border border-emerald-200 rounded-3xl p-4 space-y-2 transition-all";
              if (fStatus) fStatus.innerText = "Jawaban kamu benar! 🎉";
              if (fIcon) fIcon.className = "fa-solid fa-star text-amber-500";
              if (pText && data.penjelasan) pText.innerText = data.penjelasan;
              showToast('Hebat! Jawaban kamu benar! (+15 XP)', 'success');
            } else {
              btn.className = "w-full p-3 rounded-2xl border-2 border-rose-400 bg-rose-50 text-left text-xs font-semibold text-rose-800 transition flex items-center justify-between";
              if (fCard) fCard.className = "bg-amber-50/90 border border-amber-200 rounded-3xl p-4 space-y-2 transition-all";
              if (fStatus) fStatus.innerText = "Jawaban kurang tepat!";
              if (fIcon) fIcon.className = "fa-solid fa-circle-exclamation text-amber-500";
              if (pText) pText.innerText = 'Coba baca penjelasan materi dan pilih jawaban yang benar ya!';
              showToast('Kurang tepat, coba lagi ya!', 'info');
            }
          };

          container.appendChild(btn);
        });
      }
    }

    function handleNavBrandClick() {
      if (!appState.currentUser) {
        navigateTo('landing');
        return;
      }
      var role = appState.currentUser.role;
      if (role === 'Siswa') navigateTo('habit-1');
      else if (role === 'Guru') navigateTo('dashboard-guru');
      else navigateTo('dashboard-kepsek');
    }

    // ==========================================
    // LOGIN & LOGOUT HANDLER
    // ==========================================
    function onLoginSuccess() {
      var user = appState.currentUser;
      document.getElementById('header-user-name').innerText = user.panggilan || user.nama || user.username;
      document.getElementById('header-user-kelas').innerText = user.role === 'Siswa' ? user.kelas : user.role;
      document.getElementById('header-user-avatar').src = 'https://api.dicebear.com/7.x/bottts/svg?seed=' + encodeURIComponent(user.username);

      showToast('Selamat datang, ' + (user.panggilan || user.nama) + '!', 'success');

      if (user.role === 'Siswa') {
        syncAllMateriKuisSiswa();
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.habitsToday) {
              appState.habitsToday = res.habitsToday;
            }
            if (typeof renderDashboardUI === 'function') renderDashboardUI();
            navigateTo('dashboard');
          })
          .apiGetInitialSiswaData(user.username);
      } else if (user.role === 'Guru') {
        syncAllMateriKuisSiswa();
        if (typeof initDashboardGuru === 'function') initDashboardGuru();
        navigateTo('dashboard-guru');
      } else {
        syncAllMateriKuisSiswa();
        if (typeof initDashboardKepsek === 'function') initDashboardKepsek();
        navigateTo('dashboard-kepsek');
      }
    }

    function handleLogout() {
      if (!confirm('Apakah Anda yakin ingin keluar dari aplikasi?')) return;
      appState.currentUser = null;
      appState.habitsToday = {};
      navigateTo('landing');
      showToast('Anda telah keluar.', 'info');
    }

    // ==========================================
    // SIDEBAR NAVIGATION RENDERER (LMS STYLE)
    // ==========================================
    function renderSidebarNav() {
      var container = document.getElementById('sidebar-nav-items');
      container.innerHTML = '';
      var user = appState.currentUser || {};
      var cur = appState.currentView;

      if (user.role === 'Siswa') {
        var menuSiswa = [
          { id: 'dashboard', label: 'Dashboard', icon: 'fa-solid fa-house' },
          { id: 'habit-1', label: 'Bangun Pagi', icon: 'fa-solid fa-sun', activeGradient: true },
          { id: 'habit-2', label: 'Beribadah', icon: 'fa-solid fa-hands-praying' },
          { id: 'habit-3', label: 'Berolahraga', icon: 'fa-solid fa-person-running' },
          { id: 'habit-4', label: 'Gemar Belajar', icon: 'fa-solid fa-book-open' },
          { id: 'habit-5', label: 'Makan Sehat', icon: 'fa-solid fa-apple-whole' },
          { id: 'habit-6', label: 'Membantu Ortu', icon: 'fa-solid fa-hand-holding-heart' },
          { id: 'habit-7', label: 'Tidur Tepat', icon: 'fa-solid fa-moon' }
        ];

        menuSiswa.forEach(function(item) {
          var isActive = (cur === item.id);
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.onclick = function() { navigateTo(item.id); };

          if (isActive) {
            btn.className = "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-bold text-white bg-gradient-to-r from-amber-500 to-orange-500 shadow-lg shadow-orange-500/25 transition";
          } else {
            btn.className = "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800/80 transition";
          }

          btn.innerHTML = `
            <i class="${item.icon} text-sm w-5 text-center"></i>
            <span>${item.label}</span>
          `;
          container.appendChild(btn);
        });

      } else if (user.role === 'Guru') {
        var menuGuru = [
          { id: 'dashboard-guru', label: 'Monitoring Kelas', icon: 'fa-solid fa-clipboard-check' },
          { id: 'materi-kuis', label: 'Kelola Materi & Kuis', icon: 'fa-solid fa-graduation-cap', action: function() { bukaModalMateriKuis(1); } },
          { id: 'data-siswa', label: 'Data Siswa', icon: 'fa-solid fa-users', action: function() { navigateTo('data-siswa'); if (typeof muatDataSiswa === 'function') muatDataSiswa(false); } }
        ];

        menuGuru.forEach(function(item) {
          var isActive = (cur === item.id);
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.onclick = item.action || function() { navigateTo(item.id); };
          btn.className = isActive 
            ? "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-bold text-white bg-gradient-to-r from-teal-500 to-emerald-600 shadow-md transition"
            : "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800/80 transition";
          btn.innerHTML = `<i class="${item.icon} text-sm w-5 text-center"></i><span>${item.label}</span>`;
          container.appendChild(btn);
        });

      } else {
        // Kepala Sekolah
        var menuKepsek = [
          { id: 'dashboard-kepsek', label: 'Dashboard Kepsek', icon: 'fa-solid fa-chart-pie' },
          { id: 'dashboard-guru', label: 'Jurnal Kelas', icon: 'fa-solid fa-chalkboard-user' },
          { id: 'data-siswa', label: 'Data Siswa', icon: 'fa-solid fa-users', action: function() { navigateTo('data-siswa'); if (typeof muatDataSiswa === 'function') muatDataSiswa(false); } },
          { id: 'data-guru', label: 'Data Guru', icon: 'fa-solid fa-user-tie', action: function() { navigateTo('data-guru'); if (typeof muatDataGuru === 'function') muatDataGuru(false); } },
          { id: 'pengaturan', label: 'Pengaturan Sekolah', icon: 'fa-solid fa-gear', action: function() { navigateTo('pengaturan'); if (typeof muatPengaturanUI === 'function') muatPengaturanUI(); } }
        ];

        menuKepsek.forEach(function(item) {
          var isActive = (cur === item.id);
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.onclick = item.action || function() { navigateTo(item.id); };
          btn.className = isActive 
            ? "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-bold text-white bg-gradient-to-r from-indigo-500 to-violet-600 shadow-md transition"
            : "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800/80 transition";
          btn.innerHTML = `<i class="${item.icon} text-sm w-5 text-center"></i><span>${item.label}</span>`;
          container.appendChild(btn);
        });
      }
    }

    // ==========================================
    // MOBILE BOTTOM NAVIGATION (LMS EDUCERIA 4 TABS)
    // ==========================================
    function renderMobileBottomNav() {
      var container = document.getElementById('mobile-bottom-nav');
      if (!container) return;
      container.innerHTML = '';
      var user = appState.currentUser || {};
      var cur = appState.currentView;

      if (user.role === 'Siswa') {
        container.innerHTML = `
          <!-- 1. Beranda -->
          <button id="bnav-beranda" type="button" onclick="bukaTabSiswa('beranda')" class="relative flex flex-col items-center py-1.5 px-3 text-[10px] font-black text-amber-500 transition active:scale-95">
            <i class="fa-solid fa-house text-base mb-0.5"></i>
            <span>Beranda</span>
          </button>

          <!-- 2. Kelas / 7 Misi -->
          <button id="bnav-kelas" type="button" onclick="bukaTabSiswa('kelas')" class="relative flex flex-col items-center py-1.5 px-3 text-[10px] font-semibold text-slate-400 hover:text-slate-700 transition active:scale-95">
            <i class="fa-solid fa-shapes text-base mb-0.5"></i>
            <span>Kelas</span>
          </button>

          <!-- 3. Notifikasi (dengan Red Badge '3') -->
          <button id="bnav-notif" type="button" onclick="bukaTabSiswa('notif')" class="relative flex flex-col items-center py-1.5 px-3 text-[10px] font-semibold text-slate-400 hover:text-slate-700 transition active:scale-95">
            <div class="relative">
              <i class="fa-solid fa-bell text-base mb-0.5"></i>
              <span class="absolute -top-1 -right-2 w-3.5 h-3.5 bg-rose-500 text-white rounded-full text-[8px] font-black flex items-center justify-center shadow-xs">3</span>
            </div>
            <span>Notifikasi</span>
          </button>

          <!-- 4. Lainnya / Profil -->
          <button id="bnav-profil" type="button" onclick="bukaTabSiswa('profil')" class="relative flex flex-col items-center py-1.5 px-3 text-[10px] font-semibold text-slate-400 hover:text-slate-700 transition active:scale-95">
            <i class="fa-solid fa-bars text-base mb-0.5"></i>
            <span>Lainnya</span>
          </button>
        `;
      } else if (user.role === 'Guru') {
        container.innerHTML = `
          <button onclick="navigateTo('dashboard-guru')" class="flex flex-col items-center py-1 px-3 text-[10px] font-bold ${cur === 'dashboard-guru' ? 'text-emerald-500' : 'text-slate-400'}">
            <i class="fa-solid fa-clipboard-check text-base"></i>
            <span>Monitoring</span>
          </button>
          <button onclick="navigateTo('data-siswa'); if (typeof muatDataSiswa === 'function') muatDataSiswa(false);" class="flex flex-col items-center py-1 px-3 text-[10px] font-bold ${cur === 'data-siswa' ? 'text-emerald-500' : 'text-slate-400'}">
            <i class="fa-solid fa-users text-base"></i>
            <span>Siswa</span>
          </button>
          <button onclick="handleLogout()" class="flex flex-col items-center py-1 px-3 text-[10px] font-bold text-rose-500">
            <i class="fa-solid fa-arrow-right-from-bracket text-base"></i>
            <span>Keluar</span>
          </button>
        `;
      } else {
        container.innerHTML = `
          <button onclick="navigateTo('dashboard-kepsek')" class="flex flex-col items-center py-1 px-2 text-[10px] font-bold ${cur === 'dashboard-kepsek' ? 'text-emerald-500' : 'text-slate-400'}">
            <i class="fa-solid fa-chart-pie text-base"></i>
            <span>Laporan</span>
          </button>
          <button onclick="navigateTo('dashboard-guru')" class="flex flex-col items-center py-1 px-2 text-[10px] font-bold ${cur === 'dashboard-guru' ? 'text-emerald-500' : 'text-slate-400'}">
            <i class="fa-solid fa-chalkboard-user text-base"></i>
            <span>Kelas</span>
          </button>
          <button onclick="navigateTo('data-siswa'); if (typeof muatDataSiswa === 'function') muatDataSiswa(false);" class="flex flex-col items-center py-1 px-2 text-[10px] font-bold ${cur === 'data-siswa' ? 'text-emerald-500' : 'text-slate-400'}">
            <i class="fa-solid fa-users text-base"></i>
            <span>Siswa</span>
          </button>
          <button onclick="handleLogout()" class="flex flex-col items-center py-1 px-2 text-[10px] font-bold text-rose-500">
            <i class="fa-solid fa-arrow-right-from-bracket text-base"></i>
            <span>Keluar</span>
          </button>
        `;
      }
    }

    function updateBottomNavIcons(activeTab) {
      var user = appState.currentUser || {};
      if (user.role !== 'Siswa') return;

      var tabs = ['beranda', 'kelas', 'notif', 'profil'];
      tabs.forEach(function(t) {
        var el = document.getElementById('bnav-' + t);
        if (el) {
          if (t === activeTab) {
            el.className = "relative flex flex-col items-center py-1.5 px-3 text-[10px] font-black text-amber-500 transition scale-105";
          } else {
            el.className = "relative flex flex-col items-center py-1.5 px-3 text-[10px] font-semibold text-slate-400 hover:text-slate-700 transition";
          }
        }
      });
    }

    // ==========================================
    // TOAST NOTIFICATIONS
    // ==========================================
    function showToast(message, type) {
      var container = document.getElementById('toast-container');
      var toast = document.createElement('div');
      toast.className = 'pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl border text-xs font-bold transition-all transform duration-300 translate-y-2 opacity-0';

      if (type === 'success') {
        toast.className += ' bg-emerald-600 text-white border-emerald-500';
        toast.innerHTML = '<i class="fa-solid fa-circle-check text-base"></i> <span>' + message + '</span>';
      } else if (type === 'error') {
        toast.className += ' bg-rose-600 text-white border-rose-500';
        toast.innerHTML = '<i class="fa-solid fa-circle-exclamation text-base"></i> <span>' + message + '</span>';
      } else {
        toast.className += ' bg-slate-900 text-white border-slate-700';
        toast.innerHTML = '<i class="fa-solid fa-circle-info text-base text-amber-400"></i> <span>' + message + '</span>';
      }

      container.appendChild(toast);

      setTimeout(function() {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      setTimeout(function() {
        toast.classList.add('opacity-0', 'translate-x-4');
        setTimeout(function() {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
      }, 3500);
    }
  </script>
